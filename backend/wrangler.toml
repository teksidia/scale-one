name = "scale-one-backend"
main = "src/index.ts"
compatibility_date = "2026-08-12"
compatibility_flags = ["nodejs_compat"]
account_id = "0984ae3f01b5b32b3994c1724104b0db"

[observability]
enabled = true

# DATABASE_URL is a secret, not a var: `wrangler secret put DATABASE_URL`
# for the deployed Worker, or a .dev.vars file (see .dev.vars.example) for
# `wrangler dev` locally.

# This Worker serves the built frontend directly (single origin, no
# separate Cloudflare Pages project — see 00e) so a cross-site cookie
# problem never arises between the SPA and the API. API routes are
# scoped to /api/* (app.ts) so they never collide with the asset handler's
# SPA fallback for the frontend's own client-side routes.
[assets]
directory = "../frontend/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# One-time setup per 00b's Prerequisites: `wrangler kv namespace create
# RATE_LIMIT`, then replace the id below with the one it prints. Works
# locally with any id — `wrangler dev` emulates KV in local persistence
# mode regardless of whether the id is a real remote namespace.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "1f159e12cb5c4ab381bc255e1ec7a976"
