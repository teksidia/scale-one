name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm --filter @scale-one/backend typecheck

      - name: Typecheck frontend
        run: pnpm --filter @scale-one/frontend typecheck

      - name: Build and deploy
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Single-origin deploy (architecture.md → Deployment): the SPA
          # and API share one Worker, so the API base is same-origin/
          # relative, not an absolute URL. Must be set here — frontend/.env
          # (VITE_API_URL=http://localhost:8787, for local dev against a
          # separate `wrangler dev` port) is gitignored and never present
          # in CI, so without this the build embeds `undefined` as the
          # base URL and the deployed app crashes on load.
          VITE_API_URL: ""
